name: publish

# Build and push the container image to GHCR, split by release channel:
#   push to main      -> :edge                     (integration/soak channel)
#   tag vX.Y.Z        -> :X.Y.Z, :X.Y, :latest     (the release channel)
#   workflow_dispatch -> whatever the ref qualifies for (main -> :edge)
# `:latest` is ONLY ever a tagged release — fresh installs (compose default,
# StackScripts, README quickstart) resolve to it, so an untagged main build
# must never shadow it. The fleet itself pins exact versions.
#   git tag v0.6.0 && git push origin v0.6.0
#
# amd64 only for now: the Dockerfile installs the Intel QSV media stack
# (intel-media-va-driver-non-free, libmfx1), which is x86-only. arm64 would
# need those packages guarded behind a TARGETARCH check in the Dockerfile.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
