name: tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, "redesign/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --dev

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Test
        run: uv run pytest --cov=transcode_forge --cov-report=term-missing

  qa-sweep:
    # Deterministic UX/QA sweep (axe + error capture + screenshots) against a
    # seeded demo-static instance. Separate job — needs a browser, no Redis.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: UX sweep
        run: uv run pytest tests/qa/ -q

      - name: Upload sweep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: tests/qa/shots/
          if-no-files-found: ignore
