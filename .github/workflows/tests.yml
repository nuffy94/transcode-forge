name: tests

on:
  push:
    branches: [main]
    # A v* tag runs the whole suite again on the tagged commit, because the
    # publish job at the bottom only releases what this run just tested.
    tags: ["v*"]
  pull_request:
    branches: [main, "redesign/**"]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    # 2026-08-31: a run with 953 tests PASSING in 8m51 was killed at the
    # old 10-minute ceiling during coverage teardown (setup + lint + mypy
    # eat the rest). 15 gives headroom for suite growth + slow runners.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --dev

      - name: Install ffmpeg
        # Needed by the real-encode pipeline integration test
        # (tests/test_pipeline_integration.py). Ubuntu's build ships
        # libx265 + libsvtav1; the test self-skips any missing encoder.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint
        run: uv run ruff check src/ tests/ qa/ scripts/

      - name: Format check
        run: uv run ruff format --check src/ tests/ qa/ scripts/

      - name: Type check
        run: uv run mypy src/

      - name: Test
        run: uv run pytest --cov=transcode_forge --cov-report=term-missing

  test-postgres:
    # The same suite against real Postgres (the production DB) — exercises the
    # asyncpg wrapper, ? -> $N placeholder translation, and real transactions
    # that SQLite-only runs can't reach. TF_TEST_DB_URL flips conftest onto
    # one shared DB, migrated once and TRUNCATEd per test. Separate job so a
    # Postgres-only failure is isolated and the free SQLite lane stays fast.
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: tf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --dev

      - name: Install ffmpeg
        # The real-encode pipeline integration test runs here too.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test (Postgres)
        env:
          TF_TEST_DB_URL: postgresql://tf:tf@localhost:5432/tf_test
        run: uv run pytest -p no:cacheprovider

  qa-sweep:
    # Deterministic UX/QA sweep (axe + error capture + screenshots) against a
    # seeded demo-static instance. Separate job — needs a browser, no Redis.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --dev

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: UX sweep
        run: uv run pytest tests/qa/ -q

      - name: Upload sweep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: tests/qa/shots/
          if-no-files-found: ignore

  css-fresh:
    # The served app.css is generated from assets/css/forge.css by the pinned
    # Tailwind v4 standalone CLI (scripts/build_css.py). Fail the build if the
    # committed CSS is stale relative to its source. No deps — stdlib only.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify committed CSS is fresh
        run: python scripts/build_css.py --check

  image-build:
    # Prove the production image recipe at PR time: the Dockerfile builds and
    # its baked-in smoke (encoder presence + every VMAF model the gate can
    # name, scored on 1080p frames) passes. No push: the publish job below
    # does that, after every job here passes. Before this job, a broken
    # Dockerfile only surfaced at publish time.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: transcode-forge:ci
          cache-from: type=gha

      - name: Installed packages match uv.lock
        # The image installs from the lock export; this proves it. Every
        # distribution in the built image must be pinned in uv.lock at the
        # same version, so the suite tested what the fleet runs.
        run: >-
          docker run --rm -v "$PWD/scripts:/scripts:ro" transcode-forge:ci
          python /scripts/check_image_lock.py

  publish:
    # Build and push the container image to GHCR, split by release channel:
    #   push to main      -> :edge                     (integration/soak channel)
    #   tag vX.Y.Z        -> :X.Y.Z, :X.Y, :latest     (the release channel)
    #   workflow_dispatch -> whatever the ref qualifies for (main -> :edge)
    # It needs every other job, so an image only ever comes from a run that
    # tested that exact commit. This used to be its own workflow with its own
    # triggers, and v0.16.0's images went public 11 minutes before that
    # commit's tests finished (red, from a flaky test).
    # `:latest` is ONLY ever a tagged release: fresh installs (compose default,
    # StackScripts, README quickstart) resolve to it, so an untagged main build
    # must never shadow it. The fleet itself pins exact versions.
    #   git tag v0.6.0 && git push origin v0.6.0
    #
    # amd64 only for now: the Dockerfile installs the Intel QSV media stack
    # (intel-media-va-driver-non-free, libmfx1), which is x86-only. arm64 would
    # need those packages guarded behind a TARGETARCH check in the Dockerfile.
    needs: [test, test-postgres, qa-sweep, css-fresh, image-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
