[project]
name = "transcode-forge"
dynamic = ["version"]
description = "Self-hosted distributed media transcoding system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "redis>=5.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "prometheus-fastapi-instrumentator>=7.0",
    "bcrypt>=4.0",
    "itsdangerous>=2.0",
    "aioboto3>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "moto[s3]>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v --ignore=tests/e2e --ignore=tests/qa --ignore=tests/test_s3_integration.py"
markers = [
    "e2e: End-to-end browser tests (run with: pytest tests/e2e/)",
    "qa: UX/QA sweep against a seeded demo instance (run with: pytest tests/qa/)",
    "s3_integration: S3 integration tests with MinIO (run with: pytest tests/test_s3_integration.py)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # Depends() in function defaults — idiomatic FastAPI pattern
    "SIM105",  # contextlib.suppress vs try/except/pass — preference
    "SIM117",  # nested with statements — sometimes clearer
    "RUF012",  # mutable class defaults — Pydantic handles these
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "aioboto3.*",
    "boto3.*",
    "botocore.*",
    "s3transfer.*",
]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/transcode_forge/__init__.py"

[dependency-groups]
dev = [
    "pillow>=12.1.1",
    "pytest-playwright>=0.7.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transcode_forge"]
