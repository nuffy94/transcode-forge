{% extends "base.html" %}
{% from "partials/_icons.html" import icon %}
{% block title %}Statistics · Transcode Forge{% endblock %}

{% block content %}
<div class="flex flex-col gap-4">

    <header>
        <h1 class="text-[15px] font-semibold text-forge-paper">Statistics</h1>    </header>

    <div id="stats-container"
         hx-get="/partials/stats"
         hx-trigger="load, every 30s"
         hx-swap="innerHTML">
        <div class="forge-empty">{{ icon('loader', 'forge-icon--spin') }}</div>
    </div>
</div>
{% endblock %}
