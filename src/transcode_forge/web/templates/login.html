{% from "partials/_icons.html" import icon %}
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    {% include "partials/_head.html" %}
    <title>Sign in · Transcode Forge</title>
</head>
<body class="bg-forge-bg text-forge-paper font-body forge-grain antialiased min-h-screen flex items-center justify-center px-6">
    <div class="forge-seam" aria-hidden="true"></div>

    <div class="w-full max-w-sm relative z-10">
        <div class="flex items-center justify-center gap-3 mb-6">
            <span class="forge-brand-mark">{{ icon('flame', 'forge-icon--lg') }}</span>
            <span>
                <span class="forge-brand-eyebrow">Transcode</span>
                <span class="forge-brand-word font-display !text-3xl">FORGE</span>
            </span>
        </div>

        <div class="forge-panel">
            <div class="forge-panel-hd"><h1 class="forge-panel-title">Sign in</h1></div>
            <form id="login-form" class="p-4 space-y-4" onsubmit="return doLogin(event)">
                <div>
                    <label for="password" class="forge-stat-label block mb-1.5">Password</label>
                    <input id="password" type="password" required autofocus
                           class="forge-input w-full" autocomplete="current-password">
                </div>
                <button type="submit" class="forge-btn forge-btn--ember w-full justify-center">
                    Sign in
                </button>
                <p id="err" class="font-mono text-xs text-forge-rust hidden" role="alert"></p>
            </form>
        </div>

        <p class="font-mono text-2xs text-forge-mute text-center mt-5 tracking-wider">
            v{{ app_version }}
        </p>
    </div>

    <script>
    async function doLogin(e) {
        e.preventDefault();
        const pwd = document.getElementById('password').value;
        const err = document.getElementById('err');
        err.classList.add('hidden');
        try {
            const r = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pwd}),
            });
            if (r.ok) {
                window.location.href = '/';
            } else {
                err.textContent = 'Invalid password';
                err.classList.remove('hidden');
            }
        } catch (_) {
            err.textContent = 'Network error. Is the scheduler up?';
            err.classList.remove('hidden');
        }
        return false;
    }
    </script>
</body>
</html>
