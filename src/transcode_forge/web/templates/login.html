<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Transcode Forge</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/app.css">
    <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: {
        "forge-bg":"#0d0b08","forge-surface":"#15120e","forge-panel":"#1c1813",
        "forge-paper":"#e8e4dd","forge-ink":"#a8a195","forge-mute":"#9a8f7d",
        "forge-rule":"#3a342a","forge-rule-bright":"#5a4f3e",
        "forge-ember":"#ff7a1a","forge-ember-hot":"#ffa856","forge-rust":"#d75d3a",
    }, fontFamily: {
        display: ["Big Shoulders Display","sans-serif"],
        body:    ["IBM Plex Sans","sans-serif"],
        mono:    ["IBM Plex Mono","monospace"],
    }}}};
    </script>
</head>
<body class="bg-forge-bg text-forge-paper font-body antialiased min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <p class="font-mono text-[10px] uppercase tracking-[0.3em] text-forge-mute mb-2">Transcode</p>
            <h1 class="font-display font-black text-6xl text-forge-paper leading-none tracking-tight">FORGE</h1>
        </div>

        <div class="forge-panel p-7 relative">
            <span class="forge-tick forge-tick-tl"></span>
            <span class="forge-tick forge-tick-tr"></span>
            <span class="forge-tick forge-tick-bl"></span>
            <span class="forge-tick forge-tick-br"></span>
            <p class="forge-stat-label mb-4">Sign in</p>

            <form id="login-form" class="space-y-4" onsubmit="return doLogin(event)">
                <div>
                    <label for="password" class="forge-stat-label block mb-1.5">Password</label>
                    <input id="password" type="password" required autofocus
                           class="forge-input w-full"
                           placeholder="">
                </div>
                <button type="submit" class="forge-btn forge-btn--ember w-full justify-center">
                    Sign in
                </button>
                <p id="err" class="font-mono text-xs text-forge-rust hidden"></p>
            </form>
        </div>

        <p class="font-mono text-[10px] text-forge-mute text-center mt-6 tracking-wider">
            v{{ app_version }}
        </p>
    </div>

    <script>
    async function doLogin(e) {
        e.preventDefault();
        const pwd = document.getElementById('password').value;
        const err = document.getElementById('err');
        err.classList.add('hidden');
        try {
            const r = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: pwd}),
            });
            if (r.ok) {
                window.location.href = '/';
            } else {
                err.textContent = 'Invalid password';
                err.classList.remove('hidden');
            }
        } catch (_) {
            err.textContent = 'Network error';
            err.classList.remove('hidden');
        }
        return false;
    }
    </script>
</body>
</html>
