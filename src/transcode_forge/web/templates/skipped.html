{% extends "base.html" %}
{% block title %}Skipped — Transcode Forge{% endblock %}

{% block content %}
<div class="flex flex-col gap-8">

    <header class="forge-rise forge-rise-1">
        <p class="font-mono text-[10px] uppercase tracking-stamp text-forge-mute mb-2">
            <span class="text-forge-ember">/</span> Section 07 &nbsp;·&nbsp; Exclusions
        </p>
        <h1 class="font-display font-black text-forge-paper leading-[0.85] tracking-tight" style="font-size: clamp(3rem, 6vw, 4.5rem);">SKIPPED</h1>
        <p class="font-mono text-xs text-forge-ink mt-3 max-w-2xl">
            Files the forge declined to process &mdash; already HEVC, wrong codec, would have grown, or manually skipped.
        </p>
    </header>

    <div id="skip-stats"
         class="forge-rise forge-rise-2"
         hx-get="/partials/skip-stats"
         hx-trigger="load, every 30s"
         hx-swap="innerHTML">
        <div class="flex justify-center p-8">
            <span class="material-symbols-outlined text-forge-ember animate-spin text-3xl">settings</span>
        </div>
    </div>

    <section class="flex flex-wrap items-center gap-3 forge-rise forge-rise-3">
        <p class="forge-stat-label">Filter</p>
        <select id="skip-reason-filter" aria-label="Filter by skip reason" class="forge-select"
                hx-get="/partials/skipped"
                hx-trigger="change"
                hx-target="#skipped-container"
                hx-include="#skip-library-filter, #skip-sort, #skip-dir"
                name="reason">
            <option value="">All Reasons</option>
            <option value="already_hevc">Already HEVC</option>
            <option value="not_h264">Not H264</option>
            <option value="size_regression">Size Regression</option>
            <option value="too_small">Too Small</option>
            <option value="manual_skip">Manual Skip</option>
        </select>
        <select id="skip-library-filter" aria-label="Filter by library" class="forge-select"
                hx-get="/partials/skipped"
                hx-trigger="change"
                hx-target="#skipped-container"
                hx-include="#skip-reason-filter, #skip-sort, #skip-dir"
                name="library">
            <option value="">All Libraries</option>
        </select>
    </section>

    <input type="hidden" id="skip-sort" name="sort" value="updated_at">
    <input type="hidden" id="skip-dir" name="dir" value="desc">

    <script>
    fetch('/api/libraries').then(r => r.json()).then(({data}) => {
        const sel = document.getElementById('skip-library-filter');
        if (!sel) return;
        for (const lib of data) {
            const opt = document.createElement('option');
            opt.value = lib.name;
            opt.textContent = lib.name;
            sel.appendChild(opt);
        }
    }).catch(() => {});

    const SKIP_DESC_FIRST = ['file_size'];

    // Called from the clickable column headers (rendered fresh on each reload).
    function sortSkipped(col) {
        const s = document.getElementById('skip-sort');
        const d = document.getElementById('skip-dir');
        if (s.value === col) {
            d.value = d.value === 'asc' ? 'desc' : 'asc';
        } else {
            s.value = col;
            d.value = SKIP_DESC_FIRST.includes(col) ? 'desc' : 'asc';
        }
        const p = new URLSearchParams();
        const reason = document.getElementById('skip-reason-filter').value;
        if (reason) p.set('reason', reason);
        const library = document.getElementById('skip-library-filter').value;
        if (library) p.set('library', library);
        p.set('sort', s.value);
        p.set('dir', d.value);
        htmx.ajax('GET', '/partials/skipped?' + p.toString(),
                  {target: '#skipped-container', swap: 'innerHTML'});
    }
    </script>

    <div id="skipped-container"
         class="forge-panel relative forge-rise forge-rise-4"
         hx-get="/partials/skipped"
         hx-trigger="load"
         hx-swap="innerHTML">
        <span class="forge-tick forge-tick-tl"></span>
        <span class="forge-tick forge-tick-tr"></span>
        <span class="forge-tick forge-tick-bl"></span>
        <span class="forge-tick forge-tick-br"></span>
        <div class="flex justify-center p-8">
            <span class="material-symbols-outlined text-forge-ember animate-spin text-3xl">settings</span>
        </div>
    </div>
</div>
{% endblock %}
