- id: settings-duplicate-path-409-behind-modal
  title: Error toasts render behind any open <dialog> (top layer) — invisible AND unclickable while the modal is open
  first_seen: 2026-07-05 / S8
  last_seen: 2026-07-12 / S8
  severity: medium
  status: verified
  note: >-
    Upgraded low->medium on the 2026-07-12 release-gate sweep: hit-test
    evidence shows the general case, not just dimming. showModal() puts the
    dialog in the browser top layer; #toast-container is a plain fixed
    element, so EVERY toast fired while a dialog is open is fully obscured
    by the backdrop and unclickable (elementFromPoint at the toast's center
    resolves to DIALOG#add-lib-modal; a click on the dismiss X times out).
    Invalid add/edit-library submissions look like silent failures until
    the dialog closes. Reproduced on both the 422 empty-name and 409
    duplicate-path probes; independently re-verified on a fresh instance
    same day (elementFromPoint flips to the toast the moment the dialog
    closes). Fix directions: popover API for the toast container, append
    toasts into the open dialog, or field-level errors inside the modal.

