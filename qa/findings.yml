# Worker-resilience findings from the 2026-07-14/15 GPU concurrency bench —
# all surfaced live by us-sea's flaky network acting as a chaos monkey.
# Backend/worker, not L3 QA sweeps. Full context:
# plans/linode-deploy-staged/BENCH-RESULTS-CONCURRENCY.md.

- id: worker-exits-on-transient-claim-timeout
  title: Worker process exits on a transient claim/registration ConnectTimeout instead of retrying
  first_seen: 2026-07-14 / concurrency-bench
  severity: high
  status: fixed
  refs: {pr: 76}
  note: >-
    Surfaced live by us-sea's flaky network during the GPU concurrency
    bench (first crash of the op). Some worker HTTP paths back off on
    failure ("Claim failed — backing off"), but at least one path lets
    httpx.ConnectTimeout propagate out of the main loop and kill the
    process; the worker StackScript unit had no Restart=, so the node then
    sat dead until a manual restart. Fixed by the worker-resilience train
    (PR 76, merged 2026-07-16): both loops carry iteration catch-alls +
    worker/reliability.py backoff (a worker exits on SIGTERM/SIGINT and
    nothing else; registration retries transport/5xx forever, exits loudly
    only on a 4xx refusal), and the worker unit is Restart=always.
    Contract tests 1 and 12 in tests/test_resilience_worker.py pin it.

- id: worker-completion-report-single-shot-strands-job
  title: A single failed complete/register_derivative POST after a successful pipeline strands the job as 'transcoding' forever
  first_seen: 2026-07-14 / concurrency-bench
  severity: high
  status: fixed
  refs: {pr: 76}
  note: >-
    Surfaced by the same chaos-monkey network. After a fully successful
    pipeline (LOCK..SWAP..CLEANUP done, original already replaced), the
    completion report is single-shot: one failed
    register_derivative/complete POST abandons the job. It stays
    'transcoding' owned by a still-live worker and the S3 derivative is
    orphaned. Fixed by the worker-resilience train (PRs 74+76, merged
    2026-07-16): terminal reports are journaled to an on-disk outbox
    BEFORE the first POST and drained (with idempotent scheduler receipts)
    before any claim/registration; scheduler-side, the reconciliation
    sweep requeues jobs a LIVE worker's heartbeat has disowned past grace.
    Contract tests 2/3/6/10 pin the delivery path; the sweep is pinned in
    tests/test_resilience_scheduler.py.

- id: worker-error-logs-drop-exception-text
  title: 'Worker error logs drop the exception text for httpx timeouts ("Claim failed:  — backing off")'
  first_seen: 2026-07-14 / concurrency-bench
  severity: low
  status: fixed
  refs: {pr: 76}
  note: >-
    str(httpx.ConnectTimeout) is the empty string, so the worker's error
    lines render as "Claim failed:  — backing off" and "Unexpected worker
    error: " with no cause — which actively slowed diagnosis of the two
    bugs above during the bench. Fixed by PR 76: the agent logs repr(exc)
    on every failure path; contract test 1 asserts the repr lands in the
    log ("ConnectTimeout('injected timeout')", not a blank).
