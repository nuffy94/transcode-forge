- id: settings-duplicate-path-409-behind-modal
  title: Error toasts render behind any open <dialog> (top layer) — invisible AND unclickable while the modal is open
  first_seen: 2026-07-05 / S8
  last_seen: 2026-07-12 / S8
  severity: medium
  status: codified
  refs: {pr: 59, test: "tests/qa/test_dialogs.py::test_error_toast_above_open_dialog"}
  note: >-
    Upgraded low->medium on the 2026-07-12 release-gate sweep: hit-test
    evidence showed the general case — showModal() makes everything
    outside the dialog subtree INERT, so every toast fired while a modal
    was open was obscured by the backdrop AND unclickable. Fix (2026-07-13):
    toasts fired while a modal is open mount in a dialog-local host
    (children of the dialog stay interactive and paint above its
    backdrop); survivors migrate to the global container on dialog close.
    The popover-API direction was tried first and REJECTED: a popover
    outside the modal's subtree stays inert in Chromium even when later
    in the top layer — visible-ish but skipped by hit testing entirely.

