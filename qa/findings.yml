# QA findings ledger (qa-redesign spec D7) — committed, append-mostly.
#
# Every L3 finding lives here with a lifecycle:
#   unverified — judged by a sweep agent but never independently reproduced
#   new        — independently verified this run, not yet triaged
#   verified   — reproduced and triaged, fix not started
#   open       — accepted as real, fix pending (tracked elsewhere if ref'd)
#   fixed      — fix shipped, no deterministic guard yet
#   codified   — fixed AND guarded by a free deterministic test (the L4 loop)
#   wontfix    — adjudicated not-a-defect / not worth fixing (say why in note)
#
# ids are stable semantic slugs (route + symptom), never run-dated — the L3
# synthesize step matches new findings against the WHOLE ledger so a
# recurrence of a fixed/wontfix entry re-surfaces as that entry (status flip
# + last_seen), never as a fresh duplicate. Humans and /qa-codify advance
# status; tests/qa/test_findings_ledger.py keeps the file well-formed.
#
# Backfill 2026-07-09: the 2026-07-05 sweep (10/10 scenarios, 6/6 confirmed)
# + its ~18 unverified leads. Three leads carry their honest CURRENT status
# instead of a blanket "unverified": two were fixed by later PRs, one was
# verified live in the manual pass and is tracked in the VMAF spec.

