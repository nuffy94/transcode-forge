groups:
  - name: transcode-forge
    rules:
      - alert: TFNoWorkersOnline
        expr: tf_workers_online < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "No transcode workers online for 5 minutes"
          description: "All Transcode Forge workers are offline. Transcoding is paused."

      - alert: TFHighFailureRate
        expr: increase(tf_errors_total[1h]) > 5
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High transcode failure rate"
          description: "More than 5 errors in the last hour."

      - alert: TFQueueBacklog
        expr: tf_jobs_queued > 500
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Large queue backlog ({{ $value }} jobs)"
          description: "Queue has been above 500 jobs for 30 minutes."

      - alert: TFWorkerStuck
        expr: tf_jobs_active > 0 and changes(tf_jobs_active[30m]) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Active job count unchanged for 30 minutes"
          description: "Workers may be stuck. Check worker logs."
