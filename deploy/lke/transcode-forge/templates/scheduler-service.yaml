apiVersion: v1
kind: Service
metadata:
  # Named after the release (no -scheduler suffix): this is the address
  # workers dial — TF_SERVER_URL=http://<this>:8000.
  name: {{ include "transcode-forge.fullname" . }}
  labels:
    {{- include "transcode-forge.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    {{- include "transcode-forge.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
