apiVersion: v1
kind: Secret
metadata:
  name: {{ include "transcode-forge.fullname" . }}
  labels:
    {{- include "transcode-forge.labels" . | nindent 4 }}
type: Opaque
stringData:
  TF_AUTH_SECRET: {{ required "secrets.authSecret is required — generate one (e.g. openssl rand -base64 48) and pass it at install time" .Values.secrets.authSecret | quote }}
  {{- if .Values.postgres.enabled }}
  TF_PG_PASSWORD: {{ required "secrets.pgPassword is required while postgres.enabled=true" .Values.secrets.pgPassword | quote }}
  TF_DB_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.secrets.pgPassword (include "transcode-forge.fullname" .) .Values.postgres.database | quote }}
  {{- else }}
  TF_DB_URL: {{ required "externalDb.url is required when postgres.enabled=false" .Values.externalDb.url | quote }}
  {{- end }}
  TF_S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  TF_S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
  TF_WORKER_TOKEN: {{ .Values.secrets.workerToken | quote }}
