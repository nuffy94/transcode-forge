# Medium tier overlay — a 4 vCPU / 8 GB pool (g6-standard-4 or
# g6-dedicated-4). One worker with real CPU headroom.
#   helm install ... -f values-medium.yaml
# Replicas stay 0 at install (workers need a server-issued token); after
# issuing one: --set secrets.workerToken=... --set worker.replicas=1
worker:
  resources:
    requests:
      cpu: 1500m
      memory: 1536Mi
    limits:
      cpu: 3000m
      memory: 4Gi

scheduler:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
