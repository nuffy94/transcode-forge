apiVersion: v2
name: transcode-forge
description: >-
  Distributed h264 -> HEVC/AV1 media transcoder on Kubernetes — scheduler,
  Redis, optional in-cluster Postgres, and CPU workers, with an S3-compatible
  Object Storage media plane (LKE block storage is RWO/single-node, so media
  must live in Object Storage).
type: application
version: 0.1.6
# The image tag default tracks this. Bump both together on release.
appVersion: "0.12.0"
home: https://github.com/nuffy94/transcode-forge
